name: Build and publish Docker image

on:
  push:
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache docker-cli docker-cli-buildx
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y ca-certificates curl gnupg
              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
              chmod a+r /etc/apt/keyrings/docker.asc
              . /etc/os-release
              codename="${VERSION_CODENAME:-bookworm}"
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $codename stable" > /etc/apt/sources.list.d/docker.list
              apt-get update
              apt-get install -y docker-ce-cli docker-buildx-plugin
            else
              echo "No supported package manager found to install Docker CLI" >&2
              exit 1
            fi
          fi
          docker version
          docker buildx version

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: 10.0.0.214:28052
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      - name: Build and push image
        env:
          REGISTRY: 10.0.0.214:28052
          IMAGE_NAME: mautrix-go-wechat
        run: |
          set -eu
          short_sha="$(git rev-parse --short=12 HEAD)"
          image="$REGISTRY/$IMAGE_NAME"

          docker buildx create --use --name forgejo-builder 2>/dev/null || docker buildx use forgejo-builder
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --tag "$image:latest" \
            --tag "$image:$short_sha" \
            --push \
            .
