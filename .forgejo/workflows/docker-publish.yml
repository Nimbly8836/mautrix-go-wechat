name: Build and publish Docker image

on:
  push:
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Buildah
        run: |
          set -eu
          if command -v buildah >/dev/null 2>&1; then
            buildah --version
            exit 0
          fi
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache buildah fuse-overlayfs
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y buildah fuse-overlayfs
          else
            echo "No supported package manager found to install Buildah" >&2
            exit 1
          fi
          buildah --version

      - name: Log in to Docker registry
        env:
          REGISTRY: 10.0.0.214:28052
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -eu
          echo "$DOCKER_PASSWORD" | buildah login \
            --tls-verify=false \
            --username "$DOCKER_USERNAME" \
            --password-stdin \
            "$REGISTRY"

      - name: Build and push image
        env:
          REGISTRY: 10.0.0.214:28052
          IMAGE_NAME: mautrix-go-wechat
          STORAGE_DRIVER: vfs
          BUILDAH_ISOLATION: chroot
        run: |
          set -eu
          short_sha="$(git rev-parse --short=12 HEAD)"
          image="$REGISTRY/$IMAGE_NAME"

          buildah bud \
            --storage-driver "$STORAGE_DRIVER" \
            --isolation "$BUILDAH_ISOLATION" \
            --format docker \
            --platform linux/amd64 \
            --tag "$image:latest" \
            --tag "$image:$short_sha" \
            .

          buildah push --tls-verify=false "$image:latest" "docker://$image:latest"
          buildah push --tls-verify=false "$image:$short_sha" "docker://$image:$short_sha"
