name: Build and publish Docker image

on:
  push:
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write registry auth config
        env:
          REGISTRY: 10.0.0.214:28052
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -eu
          mkdir -p .docker
          auth="$(printf '%s:%s' "$DOCKER_USERNAME" "$DOCKER_PASSWORD" | base64 | tr -d '\n')"
          cat > .docker/config.json <<EOF
          {
            "auths": {
              "$REGISTRY": {
                "auth": "$auth"
              }
            }
          }
          EOF

      - name: Build and push image with Kaniko
        uses: docker://gcr.io/kaniko-project/executor:v1.23.2-debug
        env:
          DOCKER_CONFIG: /github/workspace/.docker
        with:
          args: >-
            --context=/github/workspace
            --dockerfile=/github/workspace/Dockerfile
            --destination=10.0.0.214:28052/mautrix-go-wechat:latest
            --destination=10.0.0.214:28052/mautrix-go-wechat:${{ github.sha }}
            --custom-platform=linux/amd64
            --insecure
            --skip-tls-verify
